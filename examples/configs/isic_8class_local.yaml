# Local config for ISIC 2019 8-class (imbalance ratio 100)
data:
  root: ./dataset/8-class
  image_dir:
    - F:/research/projects/UniSSL/datasets/isic2019/ISIC_2019_Training_Input
    - F:/research/projects/UniSSL/datasets/isic2019/ISIC_2019_Test_Input
  train_split: train_100
  val_split: val_100
  test_split: test_100
  img_size: 224

model:
  backbone: resnet50
  pretrained: true
  num_classes: 8

flexsampling:
  ssl:
    epochs: 50              # SSL contrastive pre-training epochs (0 to skip)
    batch_size: 128
    lr: 0.001
    temperature: 0.5
  anchor_scaling: 0.1
  warmup_epochs: 30
  total_epochs: 100
  patience: 10
  query_ratio: 0.1
  bald_mc_samples: 10
  batch_size: 64
  lr: 0.0003

seed: 42
output_dir: ./results/isic_8class_r100
