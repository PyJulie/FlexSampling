# Example config for ISIC 2019 8-class long-tailed classification.
# Adjust paths to your local setup.

data:
  root: ./dataset/8-class        # directory with dic.npy, train.npy, etc.
  image_dir: ./images/ISIC2019   # directory with actual image files
  img_size: 224

model:
  backbone: resnet50
  pretrained: true
  num_classes: 8

loss:
  name: cb_focal         # focal | cb_focal | cb_softmax | ldam | grw
  gamma: 1.0
  beta: 0.9999

sampler:
  name: class_aware      # weighted | class_aware | null (for default)
  num_samples_per_cls: 1

augmentation:
  mixup_alpha: 0.2       # 0 to disable

training:
  epochs: 50
  batch_size: 64
  lr: 0.01
  momentum: 0.9
  weight_decay: 1e-4
  lr_schedule: cosine     # cosine | step
  step_milestones: [30, 40]
  step_gamma: 0.1
  warmup_epochs: 5

seed: 42
output_dir: ./results/isic_8class
